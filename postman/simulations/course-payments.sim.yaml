# Simulation scaffold. Add fault-injection scenarios under each mock, e.g.:
#   scenarios:
#     - overrides:
#         conditions:
#           latency: { delay_ms: 500 }
# Then serve it with: postman simulation run <this file>

simulation: course-payments
routing: path
mocks:
  - name: flutterwave
    routeKey: flutterwave
    origin:
      - api.flutterwave.com
    interceptRequests: true
    path: postman/mocks/flutterwave
